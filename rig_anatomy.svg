<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111c33"/>
      <stop offset="1" stop-color="#0a1120"/>
    </linearGradient>
    <radialGradient id="panelglow" cx="0.22" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#1b2a4a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#0a1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2c4c"/>
      <stop offset="1" stop-color="#16203a"/>
    </linearGradient>
    <linearGradient id="cardDanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2230"/>
      <stop offset="1" stop-color="#2a1824"/>
    </linearGradient>
    <linearGradient id="cardSafe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16322c"/>
      <stop offset="1" stop-color="#102621"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3e63"/>
      <stop offset="1" stop-color="#1b2942"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs><rect x="1" y="1" width="998" height="538" rx="26" fill="url(#panel)"/><rect x="1" y="1" width="998" height="538" rx="26" fill="url(#panelglow)"/><rect x="1.5" y="1.5" width="997" height="537" rx="25.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/><text x="42" y="54" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#eef3fb" letter-spacing="0.2">the rig contract</text><text x="42" y="78" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" fill="#98a6bc">Anatomy in known rows, so walk and breath always land right</text><g filter="url(#shadow)"><rect x="80" y="134" width="288" height="288" rx="18" fill="url(#card)"/></g><rect x="80" y="134" width="288" height="288" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><image x="96" y="150" width="256" height="256" href="data:image/png;base64," style="image-rendering:pixelated"/><rect x="96" y="150" width="256" height="104" fill="#5cc7ff" fill-opacity="0.13"/><rect x="96" y="150" width="4" height="104" fill="#5cc7ff"/><rect x="96" y="254" width="256" height="80" fill="#57e0a6" fill-opacity="0.13"/><rect x="96" y="254" width="4" height="80" fill="#57e0a6"/><rect x="96" y="334" width="256" height="56" fill="#f3c668" fill-opacity="0.13"/><rect x="96" y="334" width="4" height="56" fill="#f3c668"/><line x1="86" y1="150" x2="96" y2="150" stroke="#6f7d93" stroke-width="1.5"/><text x="80" y="154" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6f7d93" text-anchor="end" letter-spacing="0">0</text><line x1="86" y1="254" x2="96" y2="254" stroke="#6f7d93" stroke-width="1.5"/><text x="80" y="258" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6f7d93" text-anchor="end" letter-spacing="0">13</text><line x1="86" y1="334" x2="96" y2="334" stroke="#6f7d93" stroke-width="1.5"/><text x="80" y="338" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6f7d93" text-anchor="end" letter-spacing="0">23</text><line x1="86" y1="382" x2="96" y2="382" stroke="#6f7d93" stroke-width="1.5"/><text x="80" y="386" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6f7d93" text-anchor="end" letter-spacing="0">29</text><line x1="96" y1="382" x2="352" y2="382" stroke="#f3c668" stroke-width="1.6" stroke-dasharray="5 4" stroke-opacity="0.8"/><text x="224.0" y="446" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#98a6bc" text-anchor="middle" letter-spacing="0">faces right  →</text><g filter="url(#shadow)"><rect x="446" y="150" width="510" height="104" rx="18" fill="url(#card)"/></g><rect x="446" y="150" width="510" height="104" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><rect x="446" y="164" width="4" height="76" rx="2" fill="#5cc7ff"/><rect x="468" y="170" width="185" height="28" rx="14" fill="#5cc7ff" fill-opacity="0.16" stroke="#5cc7ff" stroke-opacity="0.55"/><text x="561" y="189" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#5cc7ff" text-anchor="middle" letter-spacing="0.6">HEAD  ·  rows 0-12</text><text x="470" y="214" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">Identity lives here: eyes, antenna, the face.</text><text x="470" y="236" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">Never moved by the walk or the breath frame.</text><g filter="url(#shadow)"><rect x="446" y="280" width="510" height="104" rx="18" fill="url(#card)"/></g><rect x="446" y="280" width="510" height="104" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><rect x="446" y="294" width="4" height="76" rx="2" fill="#57e0a6"/><rect x="468" y="300" width="202" height="28" rx="14" fill="#57e0a6" fill-opacity="0.16" stroke="#57e0a6" stroke-opacity="0.55"/><text x="569" y="319" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#57e0a6" text-anchor="middle" letter-spacing="0.6">TORSO  ·  rows 13-22</text><text x="470" y="344" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">The breath frame lifts this block one pixel,</text><text x="470" y="366" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">so the idle reads as breathing, not bouncing.</text><g filter="url(#shadow)"><rect x="446" y="410" width="510" height="104" rx="18" fill="url(#card)"/></g><rect x="446" y="410" width="510" height="104" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.10"/><rect x="446" y="424" width="4" height="76" rx="2" fill="#f3c668"/><rect x="468" y="430" width="194" height="28" rx="14" fill="#f3c668" fill-opacity="0.16" stroke="#f3c668" stroke-opacity="0.55"/><text x="565" y="449" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" fill="#f3c668" text-anchor="middle" letter-spacing="0.6">LEGS  ·  rows 23-29</text><text x="470" y="474" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">The walk cycle articulates here. The lowest</text><text x="470" y="496" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#98a6bc" text-anchor="start" letter-spacing="0">pixel sits on row 29; the animator warns if it does not.</text></svg>